name: Accessibility Issue
description: Report an accessibility issue caused by the contents or structure of this repository's README.
title: "[Accessibility] "
labels:
  - a11y

body:
  - type: markdown
    attributes:
      value: |
        ## Accessibility Issue

        This issue tracker is intended for accessibility problems caused by the content, structure, formatting, or custom markup of this repository's README.

        Examples include inaccessible images, insufficient colour contrast, problematic HTML or SVG, confusing document structure, inaccessible tables, and other content-related barriers.

        Please do not report accessibility problems with GitHub's own interface here.

  - type: input
    id: location
    attributes:
      label: Location in the README
      description: Identify the specific section or element where the accessibility issue occurs.
      placeholder: "For example: Project index → Project 3, or the 'Getting Started' heading"
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      description: Select the category that best describes the accessibility issue.
      options:
        - Images or alternative text
        - Colour or contrast
        - Custom HTML
        - SVG or diagrams
        - Headings or document structure
        - Links
        - Tables
        - Lists
        - Code blocks or technical content
        - Embedded media
        - Text or typography
        - Information conveyed through visual presentation
        - Reading or content order
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the accessibility problem and explain how the README content creates the barrier.
      placeholder: |
        Describe the specific content or markup causing the issue.

        Explain what makes it difficult or impossible to perceive, understand,
        navigate, or otherwise access the information.
    validations:
      required: true

  - type: textarea
    id: affected-content
    attributes:
      label: Affected content
      description: Quote or describe the relevant README content. Include the relevant Markdown, HTML, SVG, or other markup where useful.
      placeholder: |
        Paste the relevant Markdown, HTML, or other markup here.

        Keep the example as small as possible while still demonstrating the issue.

  - type: textarea
    id: expected
    attributes:
      label: Expected accessible behaviour
      description: Describe how the content should be structured, presented, or interpreted to provide an accessible experience.
      placeholder: |
        Describe what should be changed or what an accessible version of the
        content should provide.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide clear steps for locating and experiencing the issue in the README.
      placeholder: |
        1. Open the README.
        2. Navigate to the affected section.
        3. ...
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Accessibility impact
      description: How significantly does this issue affect access to the README's information?
      options:
        - Prevents access to important information
        - Makes important information significantly difficult to access
        - Creates a noticeable accessibility barrier
        - Minor accessibility issue
        - Unsure
    validations:
      required: true

  - type: textarea
    id: assistive-technology
    attributes:
      label: Assistive technology or access method
      description: If relevant, describe the technology or method with which the issue was identified.
      placeholder: |
        For example:
        - Screen reader
        - Keyboard navigation
        - Browser zoom
        - High-contrast mode
        - Magnification
        - Voice control

        Include the specific software only if it is relevant to reproducing the issue.

  - type: input
    id: browser
    attributes:
      label: Browser and environment
      description: If the issue depends on a particular rendering environment, provide the browser and operating system.
      placeholder: "For example: Firefox 155 on Windows 11"

  - type: textarea
    id: guideline
    attributes:
      label: Relevant accessibility guidance
      description: If known, identify a relevant WCAG success criterion or accessibility principle. This is optional; you do not need accessibility expertise to report an issue.
      placeholder: "For example: WCAG 2.2 — 1.1.1 Non-text Content"

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested improvement
      description: If you have a proposed solution, describe it here. A suggested solution is optional.
      placeholder: |
        Describe a possible change to the README content, structure, Markdown,
        HTML, SVG, colours, or other affected element.

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Provide screenshots, rendered examples, accessibility audit results, or other evidence that helps demonstrate the issue. Remove any personal or sensitive information before submitting.
      placeholder: |
        Drag and drop relevant screenshots here, or provide additional information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: One last step before we can process your report.
      options:
        - label: I have confirmed that this issue affects the accessibility of the README.
          required: true
        - label: I have confirmed that this issue will not create a duplicate of any existing accessibility reports in this repository.
          required: true
        - label: I have confirmed that this is an issue with the contents or structure of the README, and not with the GitHub interface itself.
          required: true